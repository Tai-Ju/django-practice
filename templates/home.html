{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container">
    <h1 class="title">{{ title }}</h1>
    <p class="subtitle">{{ subtitle }}</p>
    <img src="{% static 'image/'|add:image %}">
    <div class="products">
        {% for product in products %}
            <div class="product">
                <img src="{% static 'image/'|add:product.image %}">
                <h2>{{ product.name }}</h2>
                <p>{{ product.price }}</p>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
