 {% load static %} 
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歡迎頁面</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
   <div class="container">
    {% for person in persons %}
        <h2>{{ person.name }}</h2>
        <p>{{ person.age }}</p>
    {% endfor %}
    <p>Version: {{ version }}</p>
    <p>Date: {{ date }}</p>
    <p>Last Update: {{ last_update }}</p>
   </div>
</body>
</html>
